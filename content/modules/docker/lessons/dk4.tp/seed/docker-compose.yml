services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    mem_limit: 16m
  db:
    image: postgres:16.4
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  proxy:
    image: nginx:latest
    ports:
      - "127.0.0.1:8080:80"
