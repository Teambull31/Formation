name: Deploy
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "::set-output name=version::1.0.${GITHUB_RUN_NUMBER}"
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: ./deploy.sh staging "$VERSION"
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - run: ./deploy.sh production "$VERSION"
