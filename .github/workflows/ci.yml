name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Dépôt public : runner GitHub, jamais le runner auto-hébergé du VPS (un fork pourrait y exécuter du code).
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update -q && sudo apt-get install -yq bubblewrap g++
      - run: uv sync
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
        env:
          FORMATION_TTS: espeak  # pas d'appel réseau à edge-tts depuis la CI

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm test && npm run build
        working-directory: frontend
